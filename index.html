    <script>

        let dinheiro = 0
        addDinheiro(100)

        let plantaComprada = null

        // Objeto das plantas
        let camomila = {
            nome: "Camomila",
            custo: 75,
            recompensa: 300,
            tempo: 10
        }
        let boldo = {

            custo: 250,
            recompensa: 825,
            tempo: 35
        }

        function addDinheiro(valor){
            dinheiro += valor
            document.getElementById("textoDinheiro").innerHTML = dinheiro
        }

        function comprar(planta){

            if(plantaComprada != null){
                alert("Você não pode plantar agora...")
                return
            }

            if(dinheiro < planta.custo){
                alert("Dinheiro insuficiente...")
                return
            }

            addDinheiro(-planta.custo)

            plantaComprada = structuredClone(planta) // depp clone

            document.getElementById("nomePlanta").innerHTML = planta.nome
            document.getElementById("tempoPlanta").innerHTML = planta.tempo
        }
    
        function atualizarPlantacao(){
            
        }

        function timer(){

            setTimeout(() => {
                atualizarPlantacao()
                console.log("Oi")
                timer() //looping infinito
            }, 1000);
        }

    </script>
